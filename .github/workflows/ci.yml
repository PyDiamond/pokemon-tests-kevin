name: Java CI with Maven

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - kevin-tests

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4

        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run tests and coverage
        run: mvn clean install